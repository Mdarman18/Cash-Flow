<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash-Flow | Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <h1>Cash-Flow</h1>
            </div>
            <div class="header-actions">
                <select id="currency-selector" aria-label="Select Currency" disabled title="Loading exchange rates...">
                    <option value="INR">INR (₹)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                    <option value="GBP">GBP (£)</option>
                </select>
                <button id="reset-btn" class="btn-danger">Reset Data</button>
                <button id="download-pdf-btn" class="btn-primary">Download Report</button>
            </div>
        </header>

        <div id="low-balance-warning" class="alert hidden" aria-live="polite">
            ⚠️ Critical Balance Warning: Your remaining balance is below 10% of your salary.
        </div>

        <main class="dashboard">
            <!-- Summary Cards -->
            <section class="summary-cards">
                <div class="card summary-card">
                    <h3>Total Salary</h3>
                    <p id="total-salary-display">₹0.00</p>
                </div>
                <div class="card summary-card">
                    <h3>Total Expenses</h3>
                    <p id="total-expenses-display">₹0.00</p>
                </div>
                <div class="card summary-card" id="remaining-balance-card">
                    <h3>Remaining Balance</h3>
                    <p id="remaining-balance-display">₹0.00</p>
                </div>
            </section>

            <div class="grid-layout">
                <!-- Inputs Section -->
                <section class="inputs-section">
                    <div class="card input-card">
                        <h2>Set Salary</h2>
                        <form id="salary-form" novalidate>
                            <div class="form-group">
                                <label for="salary-input">Total Salary</label>
                                <input type="number" id="salary-input" min="0" step="0.01" placeholder="Enter salary amount">
                                <span class="error-msg" id="salary-error"></span>
                            </div>
                            <button type="submit" class="btn-primary w-100">Set Salary</button>
                        </form>
                    </div>

                    <div class="card input-card">
                        <h2>Add Expense</h2>
                        <form id="expense-form" novalidate>
                            <div class="form-group">
                                <label for="expense-name">Expense Name</label>
                                <input type="text" id="expense-name" placeholder="e.g., Food, Rent">
                                <span class="error-msg" id="expense-name-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="expense-amount">Expense Amount</label>
                                <input type="number" id="expense-amount" min="0.01" step="0.01" placeholder="Enter amount">
                                <span class="error-msg" id="expense-amount-error"></span>
                            </div>
                            <button type="submit" class="btn-secondary w-100">Add Expense</button>
                        </form>
                    </div>
                </section>

                <!-- Visualization and List -->
                <section class="data-section">
                    <div class="card chart-container">
                        <h2>Financial Overview</h2>
                        <div class="canvas-wrapper">
                            <canvas id="expense-chart"></canvas>
                        </div>
                    </div>

                    <div class="card expenses-container">
                        <h2>Expense List</h2>
                        <ul id="expense-list">
                            <!-- Dynamically generated expenses go here -->
                        </ul>
                        <div id="empty-state" class="empty-state">No expenses added yet.</div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
